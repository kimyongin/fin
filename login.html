<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — 포트폴리오</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>포트폴리오</h1>
        <p class="muted">이메일로 로그인 링크를 보내드립니다</p>

        <button id="google-login" class="btn-primary">Google로 로그인</button>

        <div class="divider">또는</div>

        <form id="login-form">
            <input type="email" id="email" placeholder="이메일" required autocomplete="email">
            <br><br>
            <button type="submit" class="btn-ghost">로그인 링크 보내기</button>
        </form>

        <button id="check-session" class="btn-ghost">로그인 완료 확인</button>

        <p id="message" class="message hidden"></p>
    </div>
    <script type="module" src="js/login.js?v=auth-guard-2"></script>
</body>
</html>
