name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci


      - name: Run unit tests
        run: npm test

      - name: Check MCP workflow guides
        run: npm run check:workflow-guides

      - name: Check Edge Functions
        run: npm run check:edge

      - name: Build application and check encoding
        run: npm run build

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Run isolated Supabase E2E suite
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verification-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
