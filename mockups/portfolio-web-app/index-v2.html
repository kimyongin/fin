<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Web App · v2</title>
  <style>
    :root {
      --bg: #0a0b0d;
      --surface: #14151a;
      --surface-2: #1c1d23;
      --surface-3: #24262d;
      --border: rgba(255, 255, 255, 0.08);
      --border-2: rgba(255, 255, 255, 0.16);
      --text: #ececef;
      --muted: #8a8e96;
      --muted-2: #5b5e66;
      --accent: #ff8a00;
      --accent-ink: #1a0f00;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --info: #60a5fa;
      --info-bg: rgba(96, 165, 250, 0.12);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", system-ui, sans-serif;
      font-feature-settings: "tnum";
    }

    * { box-sizing: border-box; }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar { display: none; }
    html, body {
      max-width: 100%;
      overflow: hidden;
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }

    /* ── Layout shell ─────────────────────────────────────────── */
    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 2px 0 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      border-radius: 7px;
      font-size: 14px;
    }
    .brand strong { display: block; font-size: 13px; }
    .brand span { color: var(--muted); font-size: 11px; }
    .brand > div:not(.brand-mark) { display: none; }

    .nav { display: grid; gap: 2px; }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 36px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }
    .nav button:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
    .nav button.active { background: var(--surface-2); color: var(--text); }
    .nav svg { width: 16px; height: 16px; flex: none; opacity: 0.85; }
    .nav-label { display: inline; }

    .side-foot {
      margin-top: auto;
      color: var(--muted-2);
      font-size: 11px;
      line-height: 1.5;
      padding: 10px 6px;
      display: none;
    }

    main {
      min-width: 0;
      max-width: 100%;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 32px 80px;
      scrollbar-gutter: stable;
    }

    /* ── Hero strip ───────────────────────────────────────────── */
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .hero-left h1 {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .hero-figure {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-figure .num {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .hero-figure .delta {
      font-size: 13px;
      color: var(--muted);
    }
    .hero-figure .delta.up { color: var(--success); }
    .hero-figure .delta.down { color: var(--danger); }
    .hero-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      min-height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }
    .btn:hover { background: var(--surface-3); }
    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }
    .btn.ghost:hover { color: var(--text); border-color: var(--border-2); }
    .btn.danger {
      border-color: rgba(239, 68, 68, 0.5);
      background: transparent;
      color: var(--danger);
    }
    .btn.danger:hover { background: var(--danger-bg); }
    .btn.sm { min-height: 28px; padding: 0 9px; font-size: 12px; }
    .btn svg { width: 15px; height: 15px; }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border-2); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ── Section toggling ─────────────────────────────────────── */
    .section { display: none; }
    .section.active { display: block; }
    .subsection { display: none; }
    .subsection.active { display: block; }

    /* ── Filters / segmented ──────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill:hover { color: var(--text); border-color: var(--border-2); }
    .pill.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-2);
    }

    .segmented {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      min-width: 0;
    }
    .segmented button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .segmented button.active {
      background: var(--surface-3);
      color: var(--text);
    }
    .toolbar > .segmented {
      width: 100%;
    }
    .toolbar > .segmented button {
      flex: 1;
      min-width: 0;
    }
    .toolbar.tabs-only .segmented {
      width: 100%;
      max-width: none;
    }
    .toolbar.tabs-only .segmented button {
      flex: 1;
      min-width: 0;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 4px 10px;
      border-bottom: 1px solid var(--border);
      margin: 24px 0 10px;
    }
    .group-header:first-of-type { margin-top: 4px; }
    .group-header strong {
      font-size: 13px;
      font-weight: 600;
    }
    .group-header .meta {
      color: var(--muted);
      font-size: 12px;
    }
    .group-header .spacer { flex: 1; }

    /* ── Master card list ─────────────────────────────────────── */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .card:hover {
      border-color: var(--border-2);
      background: var(--surface-2);
    }
    .card.pinned {
      border-left: 2px solid var(--danger);
    }
    .card.selected {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .card.action-card {
      border-style: dashed;
      background: rgba(255,255,255,0.015);
      min-height: 52px;
      place-items: center;
    }
    .card.action-card .row1 {
      min-height: 28px;
    }
    .card.action-card .title {
      gap: 8px;
    }
    .card.action-card .plus-mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border-2);
      color: var(--text);
      font-weight: 700;
      flex: none;
    }
    .card.action-card:hover {
      border-color: var(--accent);
      background: rgba(255, 138, 0, 0.06);
    }
    .card.add-card {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 7px;
      border-color: rgba(255, 138, 0, 0.34);
      background: rgba(255, 138, 0, 0.08);
      color: var(--accent);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.28);
    }
    .card.add-card:hover {
      border-color: rgba(255, 138, 0, 0.56);
      background: rgba(255, 138, 0, 0.14);
      transform: translateY(-1px);
    }
    .card.add-card .add-card-plus {
      line-height: 1;
      font-size: 17px;
      font-weight: 500;
      transform: translateY(-1px);
    }
    .card.blank-card {
      border-color: rgba(255, 138, 0, 0.34);
    }

    /* ── Floating action buttons ──────────────────────────────── */
    .fab-stack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 30;
      pointer-events: none;
    }
    .fab-stack .fab,
    .fab-stack [data-create-card] { pointer-events: auto; }
    .fab {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      border: 1px solid rgba(255, 138, 0, 0.34);
      background: rgba(255, 138, 0, 0.14);
      color: var(--accent);
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
      font-weight: 600;
      padding-bottom: 2px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.32);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .fab:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 138, 0, 0.56);
      background: rgba(255, 138, 0, 0.22);
      box-shadow: 0 10px 20px rgba(0,0,0,0.36), 0 0 0 1px rgba(255,138,0,0.14);
    }
    .fab.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-2);
      font-size: 20px;
    }
    @media (min-width: 901px) {
      .fab-stack { right: calc(400px + 20px); }
    }
    @media (max-width: 900px) {
      .fab-stack { right: 14px; bottom: 14px; gap: 8px; }
      .fab { width: 34px; height: 34px; border-radius: 7px; font-size: 18px; }
      .fab.secondary { font-size: 18px; }
    }
    .card .row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .card .title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .card .title strong {
      font-size: 14px;
      font-weight: 600;
    }
    .card .title .ticker {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .card .value {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }
    .card .value.usd::before { content: "$"; color: var(--muted); margin-right: 1px; }
    .card .row2 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }
    .card .row2 .dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--muted-2);
      display: inline-block;
    }

    /* ── Badges ───────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .badge.success { background: var(--success-bg); color: var(--success); }
    .badge.warning { background: var(--warning-bg); color: var(--warning); }
    .badge.danger  { background: var(--danger-bg);  color: var(--danger);  }
    .badge.info    { background: var(--info-bg);    color: var(--info);    }
    .badge.neutral { background: var(--surface-3); color: var(--muted); }
    .badge.outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border-2);
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .tag-list .badge {
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .tag-list.compact .badge {
      padding: 1px 7px;
      font-size: 10px;
    }
    .tag-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .tag-picker .pill {
      background: var(--surface);
      color: var(--muted);
    }
    .tag-picker .pill.active {
      border-color: var(--accent);
      background: rgba(255, 138, 0, 0.10);
      color: var(--text);
    }
    .drawer-content[data-mode="view"] [data-edit-only] { display: none !important; }
    .drawer-content[data-mode="edit"] [data-view-only],
    .drawer-content[data-mode="create"] [data-view-only] { display: none !important; }
    .is-hidden { display: none !important; }

    /* ── Empty / inline notice ────────────────────────────────── */
    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-size: 13px;
    }
    .notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--warning-bg);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      color: var(--warning);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .notice .btn { margin-left: auto; }

    /* ── Drawer ───────────────────────────────────────────────── */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 50;
      display: none; /* desktop: drawer is always visible, no backdrop */
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #drawerClose { display: none; }
    .mobile-footer-action { display: none; }
    /* desktop: reserve right space in main for the always-on drawer */
    @media (min-width: 901px) {
      main { padding-right: calc(400px + 32px); }
      #drawerClose { display: none; }
      #drawerCancel { display: none; }
    }
    .drawer-head {
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .drawer-head .titles { flex: 1; min-width: 0; }
    .drawer-nav {
      display: flex;
      gap: 4px;
      flex: none;
    }
    .drawer-nav .icon-btn[disabled] {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .drawer-nav .pos {
      display: inline-flex;
      align-items: center;
      padding: 0 6px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      justify-content: center;
    }
    .drawer-body {
      transition: opacity 0.12s ease;
    }
    .drawer-body.swap-out { opacity: 0; }
    .drawer-head h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
    }
    .drawer-head .sub {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scrollbar-width: none;
    }
    .drawer-body::-webkit-scrollbar { display: none; }
    .drawer-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      background: var(--surface);
      position: sticky;
      bottom: 0;
      z-index: 2;
    }
    .drawer-content { display: none; }
    .drawer-content.active { display: contents; }
    .drawer-content > .block > .actions { display: none; }
    .drawer-content [data-inline-action] { display: none; }
    .drawer-foot .inline-confirm {
      margin-right: auto;
      color: var(--warning);
      font-size: 12px;
      align-self: center;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat .label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }
    .stat .v {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .stat .v.up { color: var(--success); }
    .stat .v.down { color: var(--danger); }

    .block { display: grid; gap: 10px; }
    .block h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .chart-range {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      flex: 0 0 auto;
    }
    .chart-range button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      padding: 5px 8px;
      cursor: pointer;
    }
    .chart-range button.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .feed {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .feed-row {
      padding: 10px 12px;
      display: grid;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .feed-row:last-child { border-bottom: 0; }
    .feed-row .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .feed-row .top strong { font-size: 13px; }
    .feed-row .meta {
      color: var(--muted);
      font-size: 12px;
    }
    .feed-row .actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 -2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .group-head span:last-child {
      font-weight: 500;
      color: var(--muted-2);
    }
    .log-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .load-more-card {
      min-height: 48px;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      border-style: dashed;
      cursor: pointer;

    .kv { display: grid; gap: 8px; }
    .kv .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .kv .row:last-child { border-bottom: 0; }
    .kv .row .k { color: var(--muted); }
    .kv .row .v { font-weight: 500; }

    /* indicators grid for analysis report drawer */
    .indicators {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .ind {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .ind .l { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .ind .v { font-size: 14px; font-weight: 600; }
    .ind .d { font-size: 11px; }
    .ind .d.up { color: var(--success); }
    .ind .d.down { color: var(--danger); }

    .bars { display: grid; gap: 8px; }
    .bar-row { display: grid; gap: 4px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .bar-meta strong { color: var(--text); }
    .bar {
      height: 6px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    /* ── Modal ────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(480px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .modal-head h2 { margin: 0 0 2px; font-size: 16px; }
    .modal-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
    }
    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── Forms ────────────────────────────────────────────────── */
    .form-grid { display: grid; gap: 12px; }
    .form-grid.two { grid-template-columns: 1fr 1fr; }
    .field {
      display: grid;
      gap: 5px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 7px;
      font-size: 13px;
    }
    .field select {
      padding-right: 30px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 50%,
        calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--border-2);
      background: var(--surface-3);
    }
    .field input:disabled,
    .field select:disabled,
    .field textarea:disabled {
      opacity: 1;
      color: var(--text);
      background: rgba(255,255,255,0.025);
      border-color: rgba(255,255,255,0.04);
      cursor: default;
    }
    .field select:disabled {
      background-image:
        linear-gradient(45deg, transparent 50%, transparent 50%),
        linear-gradient(135deg, transparent 50%, transparent 50%);
    }
    .field textarea { min-height: 70px; resize: vertical; }
    .field-help {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
    .field-help.warn { color: var(--warning); }
    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .switch {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: var(--surface-3);
      position: relative;
      cursor: pointer;
      flex: none;
      border: 1px solid var(--border-2);
    }
    .switch::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--muted);
      top: 2px; left: 2px;
      transition: 0.15s;
    }
    .switch.on { background: var(--accent); border-color: var(--accent); }
    .switch.on::after { left: 18px; background: var(--accent-ink); }

    .radio-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .radio-group label {
      flex: 1;
      min-width: 80px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }
    .radio-group input[type=radio] {
      margin: 0;
      accent-color: var(--accent);
    }
    .radio-group input:checked + span { color: var(--text); }
    .radio-group label:has(input:checked) {

      background: rgba(255, 138, 0, 0.08);
      color: var(--text);

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      color: var(--muted);
    }
    .check-row input { accent-color: var(--accent); }

    /* ── Composition chart ────────────────────────────────────── */
    .composition {
      --c1: #ff8a00;
      --c2: #60a5fa;
      --c3: #22c55e;
      --c4: #a78bfa;
      --c5: #f59e0b;
      --c6: #94a3b8;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px 16px;
      margin-bottom: 14px;

    .composition-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .composition-head h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .composition-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .comp-view { display: none; }
    .comp-view.active { display: block; }
    .comp-bar {
      display: flex;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface-3);
      margin-bottom: 12px;
    }
    .comp-bar > span {
      display: block;
      height: 100%;
      cursor: pointer;
      transition: filter 0.15s;
      box-shadow: inset -1px 0 0 var(--surface);
    }
    .comp-bar > span:last-child { box-shadow: none; }
    .comp-bar > span:hover { filter: brightness(1.15); }
    .comp-legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 4px 16px;
    }
    .leg {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      background: transparent;
      border: 0;
      padding: 5px 0;
      cursor: pointer;
      text-align: left;
      color: var(--muted);
      min-width: 0;

    .leg:hover { color: var(--text); }
    .leg.static { cursor: default; }
    .leg .dot {
      width: 8px; height: 8px; border-radius: 2px;
      flex: none;

    .leg .name {
      flex: 1;
      color: var(--text);

      overflow: hidden;
      text-overflow: ellipsis;

    .leg .pct {

    .leg .amt {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      flex: none;

    /* ── Price timeline chart (holding drawer) ───────────────── */
    .chart {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 12px 10px;

    .chart svg {

      overflow: visible;

    .chart .grid {

      stroke-dasharray: 2 3;

    .chart .area { fill: rgba(255, 138, 0, 0.10); stroke: none; }
    .chart .line {

      stroke: var(--accent);

    .chart .buy {

      stroke: var(--surface-2);
      stroke-width: 1.5;
    }
    .chart .sell {

      stroke: var(--surface-2);
      stroke-width: 1.5;

    .chart .ytx {

    .chart-axis {

      margin-top: 8px;
      font-variant-numeric: tabular-nums;

    .chart-axis .cur { color: var(--text); font-weight: 600; }
    .chart-legend {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .chart-legend > span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chart-legend .m { display: inline-block; }

    .chart-legend .m.sell {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
    }
    .chart-legend .m.line {
      width: 14px; height: 2px;

    .mobile-top {
      display: none;
      position: fixed;

      left: 0;
      right: 0;

      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      padding: 0 4px;
      position: relative;
      gap: 5px;
      white-space: nowrap;
    }
    .mobile-tab svg {
      width: 15px;

    }
    .mobile-tab.active {

    }
    .mobile-tab.active::after {

      right: 10px;

    }
    .mobile-session {
      color: var(--muted);

    .mobile-session svg,
    .nav button[data-section="logout"] svg {
      width: 16px;
      height: 16px;
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 900px) {
      html, body {
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
      }

        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overflow-y: visible;

      .sidebar { display: none; }
      .mobile-top { display: grid; }
      .nav-label { display: inline; }
      main {
        height: auto;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;

        overflow-y: visible;

      .toolbar,
      .list,
      .card {

      .indicators { grid-template-columns: 1fr; }
      .form-grid.two { grid-template-columns: 1fr; }
      .toolbar.tabs-only .segmented { max-width: none; }

      .drawer-backdrop { display: block; } /* mobile: re-enable backdrop */
      .drawer {

    }

</head>

function chartSvg(ticker, withTrades = false) {
  const instrument = instrumentByTicker(ticker);
  const rows = priceRows(ticker);
  const valid = rows.filter(r => Number.isFinite(r.close_price));
  if (!valid.length) {
    return `<div class="chart"><svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg"><line class="grid" x1="0" y1="35" x2="400" y2="35"/><line class="grid" x1="0" y1="75" x2="400" y2="75"/><line class="grid" x1="0" y1="115" x2="400" y2="115"/><text class="ytx" x="200" y="74" text-anchor="middle">가격 데이터 없음</text></svg><div class="chart-axis"><span>-</span><span class="cur">수동 보완 필요</span><span>-</span></div></div>`;
  }
  const values = valid.map(r => r.close_price);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const x = i => 20 + (valid.length <= 1 ? 0 : i * 366 / (valid.length - 1));
  const y = v => 115 - ((v - min) / Math.max(1, max - min)) * 82;
  const points = valid.map((r, i) => `${x(i)},${y(r.close_price)}`);
  const markers = withTrades
    ? MOCK_DATA.transactions.filter(tx => tx.ticker === ticker).slice(0, 5).map((tx, i) => `<circle class="${tx.trade_type === "SELL" ? "sell" : "buy"}" cx="${20 + i * 70}" cy="${85 - i * 8}" r="5"><title>${tx.trade_date} ${tx.trade_type}</title></circle>`).join("")
    : rows.filter(r => !Number.isFinite(r.close_price)).map(r => `<circle class="sell" cx="386" cy="42" r="5"><title>${r.price_date} missing</title></circle>`).join("");
  return `<div class="chart"><svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg"><line class="grid" x1="0" y1="35" x2="400" y2="35"/><line class="grid" x1="0" y1="75" x2="400" y2="75"/><line class="grid" x1="0" y1="115" x2="400" y2="115"/><path class="area" d="M${points.join(" L")} L386,130 L20,130 Z"/><path class="line" d="M${points.join(" L")}"/><text class="ytx" x="395" y="32" text-anchor="end">${fmtPrice(max, instrument?.currency)}</text><text class="ytx" x="395" y="118" text-anchor="end">${fmtPrice(min, instrument?.currency)}</text>${markers}</svg><div class="chart-axis"><span>${valid[0]?.price_date || "-"}</span><span class="cur">최근 ${fmtPrice(valid.at(-1)?.close_price, instrument?.currency)}</span><span>${rows.at(-1)?.price_date || "-"}</span></div><div class="chart-legend"><span><span class="m buy"></span>${withTrades ? "BUY" : "sync/manual"}</span>${withTrades ? '<span><span class="m sell"></span>SELL</span>' : rows.some(r => !Number.isFinite(r.close_price)) ? '<span><span class="m sell"></span>missing</span>' : ""}<span><span class="m line"></span>종가</span></div></div>`;
}

  }
  const tagFilter = event.target.closest("[data-tag-filter]");
  if (tagFilter) {
    const tag = tagFilter.dataset.tagFilter;
    state.selectedTags = state.selectedTags.includes(tag) ? state.selectedTags.filter(item => item !== tag) : [...state.selectedTags, tag];
    selectDefaultDrawer();
    renderApp();
    return;
  }
  const createButton = event.target.closest("[data-create-card]");
  if (createButton) {
    createDraft(createButton.dataset.createCard);
    return;
  }
  const tagChoice = event.target.closest("[data-tag-choice]");
  if (tagChoice) {
    tagChoice.classList.toggle("active");
    return;
  }
  const chartRange = event.target.closest("[data-chart-range]");
  if (chartRange) {
    state.chartRange[chartRange.dataset.chartTicker] = chartRange.dataset.chartRange;
    renderDrawer();
    return;
  }
  const reportJump = event.target.closest("[data-jump-report]");
  if (reportJump?.dataset.jumpReport) {
    state.section = "analysis";
    state.analysisTab = "reports";
    openDrawer(reportJump.dataset.jumpReport);
    return;
  }
  const drawerTrigger = event.target.closest("[data-drawer]");
  if (drawerTrigger) {
    openDrawer(drawerTrigger.dataset.drawer);
  }
});
$("#drawerFoot").addEventListener("click", event => {
  const action = event.target.closest("[data-drawer-action]")?.dataset.drawerAction;
  if (!action) return;
  if (action === "edit") {
    state.drawerMode = "edit";
    state.confirm = null;
  } else if (action === "save") {
    state.pendingDraft = state.drawerMode === "create" ? draftValues() : null;
    state.confirm = "save";
  } else if (action === "delete") {
    state.confirm = "delete";
  } else if (action === "cancel-confirm") {
    state.confirm = null;
  } else if (action === "cancel") {
    state.drawerMode = "view";
    state.confirm = null;
    state.pendingDraft = null;
  } else if (action === "confirm-save") {
    const createdDrawerId = commitCreateDraft();
    state.drawerId = createdDrawerId;
    state.drawerMode = "view";
    state.confirm = null;
    state.pendingDraft = null;
    renderApp();
    return;
  } else if (action === "confirm-delete") {
    closeDrawer();
  } else if (action === "close") {
    closeDrawer();
  } else if (action === "sync") {
    state.syncMessage = state.drawerId;
  }
  renderDrawer();
});
$("#drawerPrev").addEventListener("click", () => {
  const list = drawerList();
  const index = list.indexOf(state.drawerId);
  if (index > 0) openDrawer(list[index - 1]);
});
$("#drawerNext").addEventListener("click", () => {
  const list = drawerList();
  const index = list.indexOf(state.drawerId);
  if (index >= 0 && index < list.length - 1) openDrawer(list[index + 1]);
});
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerBackdrop").addEventListener("click", closeDrawer);
$("#sessionModal").addEventListener("click", event => {
  if (event.target === $("#sessionModal")) closeSessionModal();
  const action = event.target.closest("[data-session-action]")?.dataset.sessionAction;
  if (action === "close") closeSessionModal();
  if (action === "confirm-logout") openSessionModal("login");
  if (action === "send-link") {
    $("#sessionModalSub").textContent = "로그인 링크를 보냈습니다.";
    $("#sessionModalBody").innerHTML = '<p class="field-help" style="font-size:13px;margin:0">메일함에서 링크를 열면 로그인됩니다. 링크가 다른 브라우저에서 열렸다면 이 화면에서는 세션을 찾지 못할 수 있습니다.</p>';
    $("#sessionModalFoot").innerHTML = '<button class="btn primary" type="button" data-session-action="check-session">접속 완료 확인</button><button class="btn ghost" type="button" data-session-action="close">닫기</button>';
  }
  if (action === "check-session") {
    $("#sessionModalSub").textContent = "현재 브라우저의 세션을 확인했습니다.";
    $("#sessionModalBody").innerHTML = '<p class="field-help" style="font-size:13px;margin:0">실제 구현에서는 Supabase getSession()으로 이 브라우저에 저장된 세션을 확인합니다.</p>';
    $("#sessionModalFoot").innerHTML = '<button class="btn ghost" type="button" data-session-action="close">닫기</button>';
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeDrawer();
    closeSessionModal();
  }
});
mqDesktop.addEventListener("change", () => {
  $("#drawer").classList.remove("open");
  $("#drawerBackdrop").classList.remove("open");
  document.body.style.overflow = "";
  renderApp();
});

selectDefaultDrawer();
renderApp();

  </script>

</body>
</html>
