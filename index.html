<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-pending">
    <div class="app-shell">
        <main class="page-content">
            <div class="top-menu">
                <button class="menu-toggle" id="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="menu-popover" id="menu-popover" aria-label="주 메뉴">
                    <button class="nav-tab active" data-tab="overview">자산</button>
                    <button class="nav-tab" data-tab="accounts">계좌</button>
                    <button class="nav-tab" data-tab="instruments">종목</button>
                    <button class="nav-tab" data-tab="settings">설정</button>
                    <button id="logout-btn">로그아웃</button>
                </nav>
            </div>

            <section class="hero">
                <div class="hero-value" id="total-value">—</div>
                <div id="hero-delta"></div>
                <div class="hero-meta" id="hero-meta">로딩 중...</div>
            </section>

            <section id="tab-overview" class="tab-content"></section>
            <section id="tab-accounts" class="tab-content hidden"></section>
            <section id="tab-instruments" class="tab-content hidden"></section>
            <section id="tab-settings" class="tab-content hidden"></section>
        </main>
    </div>
    <div aria-hidden="true" style="display:none" class="!mb-5 !flex !flex-col !gap-2 !text-xs !font-bold !text-[#8a8e96] !w-full !h-11 !rounded-lg !border !border-white/15 !bg-[#0f1014] !px-3 !py-2.5 !text-sm !leading-normal !text-[#ececef] !outline-none !shadow-[inset_0_1px_0_rgba(255,255,255,0.03)] !transition focus:!border-[#ff8a00] focus:!bg-[#14151a] focus:!shadow-[0_0_0_3px_rgba(255,138,0,0.14)] hover:!border-white/25 hover:!bg-[#121319] disabled:!cursor-not-allowed disabled:!opacity-60 !min-h-24 !resize-y"></div>

    <script type="module" src="js/assets.js"></script>
</body>
</html>
