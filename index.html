<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="auth-pending">
    <div class="app-shell">
        <main class="page-content">
            <div class="top-menu">
                <button class="menu-toggle !inline-flex !h-10 !w-10 !flex-col !items-center !justify-center !gap-1 !rounded-lg !border !border-white/15 !bg-[#14151a] !text-[#ececef]" id="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
                    <span class="!h-0.5 !w-[17px] !rounded-full !bg-current"></span>
                    <span class="!h-0.5 !w-[17px] !rounded-full !bg-current"></span>
                    <span class="!h-0.5 !w-[17px] !rounded-full !bg-current"></span>
                </button>
                <nav class="menu-popover" id="menu-popover" aria-label="주 메뉴">
                    <button class="nav-tab active" data-tab="overview">자산</button>
                    <button class="nav-tab" data-tab="accounts">계좌</button>
                    <button class="nav-tab" data-tab="instruments">종목</button>
                    <button class="nav-tab" data-tab="settings">설정</button>
                    <button id="logout-btn">로그아웃</button>
                </nav>
            </div>

            <section class="hero">
                <div class="hero-value" id="total-value">—</div>
                <div id="hero-delta"></div>
                <div class="hero-meta" id="hero-meta">로딩 중...</div>
            </section>

            <section id="tab-overview" class="tab-content"></section>
            <section id="tab-accounts" class="tab-content hidden"></section>
            <section id="tab-instruments" class="tab-content hidden"></section>
            <section id="tab-settings" class="tab-content hidden"></section>
        </main>
    </div>
    <div aria-hidden="true" style="display:none" class="!inline-flex !h-10 !w-10 !flex-col !items-center !justify-center !gap-1 !rounded-lg !border !border-white/15 !bg-[#14151a] !bg-[#1c1d23] !bg-[#0f1014] !bg-[#121319] !text-[#ececef] hover:!border-[#ff8a00] hover:!bg-[#1c1d23] !h-0.5 !w-[17px] !rounded-full !bg-current !absolute !right-0 !top-12 !min-w-40 !p-1.5 !shadow-2xl !shadow-black/40 !px-3 !py-2.5 !text-left !text-sm !font-semibold !text-[#8a8e96] hover:!text-[#ececef] !w-full !bg-[#ff8a00] !text-white disabled:!cursor-not-allowed disabled:!opacity-50 !bg-transparent hover:!border-white/25 !border-red-500/70 !text-red-400 hover:!bg-red-500/10 !flex !cursor-pointer !justify-between !border-b !border-white/10 !px-4 !py-3.5 hover:!bg-[#14151a] !truncate !font-bold !font-semibold !text-[13px] !fixed !z-[300] !h-screen !w-[480px] !duration-200 !shrink-0 !overflow-y-auto !mb-5 !flex-col !gap-2 !outline-none !shadow-[inset_0_1px_0_rgba(255,255,255,0.03)] focus:!border-[#ff8a00] focus:!bg-[#14151a] focus:!shadow-[0_0_0_3px_rgba(255,138,0,0.14)] !h-11 !min-h-24 !resize-y !grid !min-h-[260px] !min-w-0 !content-start !gap-3 !p-[18px] !bg-black/10 hover:!border-white/20"></div>
    <script type="module" src="js/assets.js"></script>

</html>
