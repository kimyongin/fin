<style>
:root{--bg:#f5f5f0;--paper:#fff;--ink:#202f2a;--muted:#69766e;--line:#dfe4dc;--green:#245b47;--soft:#e8efe8;--amber:#9c691c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font-family:system-ui,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.65}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b58535;outline-offset:3px}button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 15px;border-radius:10px}button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.quiet{background:transparent}a{color:var(--green)}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;padding:32px 22px;border-right:1px solid var(--line);background:#eef0e8;display:flex;flex-direction:column}.brand{font-size:25px;letter-spacing:-1px;font-weight:750}.brand span{color:var(--green)}.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:500;color:var(--muted);margin-top:3px}.nav{display:grid;gap:8px;margin-top:50px}.nav button{text-align:left;border:0;background:transparent;padding:13px 17px;color:var(--muted);font-weight:600}.nav button[aria-current=page]{color:var(--green);background:#dae6da}.nav .num{display:inline-block;font-size:11px;width:30px;opacity:.65}.aside-bottom{margin-top:auto;display:grid;gap:8px}.aside-bottom button{text-align:left;border:0;background:transparent}.avatar{border-top:1px solid var(--line);margin-top:18px;padding:20px 10px 0;color:var(--muted)}main{margin-left:220px;max-width:1510px;padding:0 48px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:82px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase;font-weight:650}.demo{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:5px}.mobile-more{display:none}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:36px 0 26px}h1{font-size:32px;letter-spacing:-1.4px;line-height:1.35;margin:5px 0 8px}h2{font-size:20px;letter-spacing:-.6px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}p{margin:0 0 12px}.muted{color:var(--muted)}.tiny{font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.card{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:24px;margin-bottom:18px}.hero{background:#e8eee4;border:1px solid #d5e0cf;min-height:225px;position:relative}.hero h2{font-size:28px;line-height:1.45;max-width:660px;margin:14px 0}.hero-footer{margin-top:24px;padding-top:16px;border-top:1px solid #cedbca;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-block;border-radius:5px;padding:3px 8px;background:var(--soft);color:var(--green);font-size:11px;font-weight:650;margin-right:5px;white-space:nowrap}.pill.amber{background:#f7edda;color:var(--amber)}.pill.gray{background:#eff0ed;color:#667269}.row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row p{margin:5px 0 0}.linkbtn{border:0;background:transparent;color:var(--green);padding:4px 0;text-align:left;font-weight:650}.arrow{font-size:20px;color:var(--green)}.number{font-size:28px;letter-spacing:-1px;font-weight:600}.stack{display:grid;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap}.section-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.summary-grid .card{padding:20px}.tabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}.tabs button.active{background:var(--green);color:white}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th{text-align:left;font-size:12px;color:var(--muted);font-weight:500}td,th{padding:17px 12px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{padding-left:0}td.num,th.num{text-align:right}.asset-name{font-weight:650;font-size:15px}.asset-sub{display:block;color:var(--muted);font-size:12px}.allocation{display:flex;height:13px;overflow:hidden;border-radius:5px;margin:18px 0}.allocation i:nth-child(1){background:#245b47;width:60%}.allocation i:nth-child(2){background:#91ab86;width:30%}.allocation i:nth-child(3){background:#d7decf;width:10%}.quote{padding:18px 20px;background:var(--bg);border-left:3px solid #8daa80;border-radius:4px;margin:15px 0}.timeline{border-left:1px solid var(--line);padding-left:20px;margin:20px 0}.timeline p{padding:6px 0 12px}.blank{padding:45px 18px;text-align:center}.blank h2{font-size:25px}.mobile-nav{display:none}.sheet{position:fixed;inset:0;background:#16251d55;display:flex;justify-content:flex-end;z-index:10}.sheet[hidden]{display:none}.sheet-panel{width:min(580px,100%);height:100%;overflow:auto;background:var(--paper);padding:30px;box-shadow:-20px 0 60px #14251b19}.sheet-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-30px;background:white;padding:12px 0;z-index:1;border-bottom:1px solid var(--line);margin-bottom:24px}.sheet h2{font-size:26px;line-height:1.4}.sheet label{display:block;margin:16px 0 6px;font-weight:600}.sheet textarea,.sheet input{width:100%;border:1px solid var(--line);padding:12px;border-radius:8px;background:var(--bg)}.sheet textarea{height:110px;resize:vertical}.sheet input{height:46px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--ink);color:white;border-radius:10px;z-index:30;max-width:90vw}.toast:empty{display:none}.scope{background:#f7f5ed;padding:13px 16px;border-radius:8px;margin:14px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 8px;color:var(--muted);max-width:100%}.listcard{padding:20px 24px}.listcard .row{padding:0;border:0;align-items:start}.amount{font-variant-numeric:tabular-nums}.caption{color:var(--muted);font-size:12px;margin:20px 0}.progress{height:6px;border-radius:3px;background:#e7eae4;margin:14px 0 8px}.progress span{height:100%;display:block;background:var(--green);border-radius:3px}.footnote{padding:18px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.card button.linkbtn{line-height:1.7}.sidebar button,.mobile-nav button{min-height:44px}
@media(min-width:1600px){main{margin-left:calc(220px + (100vw - 1600px)/2)}}
@media(max-width:1100px){.sidebar{width:180px;padding:25px 16px}main{margin-left:180px;padding:0 28px 40px}.layout{grid-template-columns:minmax(0,1fr) 250px}}
@media(max-width:850px){.sidebar{display:none}main{margin:0;padding:0 20px 100px}.topbar{min-height:68px}.mobile-more{display:inline-block}.layout{grid-template-columns:1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#fdfefb;border-top:1px solid var(--line);z-index:5}.mobile-nav button{border:0;background:transparent;padding:6px 2px;color:var(--muted);font-size:12px}.mobile-nav button[aria-current=page]{color:var(--green);background:var(--soft);font-weight:bold}.mobile-nav span{display:block;font-size:16px;margin-bottom:1px}.pagehead{margin-top:25px;align-items:start;flex-direction:column;gap:10px}h1{font-size:28px}.hero h2{font-size:24px}.card{padding:20px}.summary-grid{gap:8px}.summary-grid .card{padding:14px 10px}.number{font-size:23px}.sheet-panel{padding:22px}.sheet-top{top:-22px}.toast{bottom:90px}.demo{font-size:10px}.table-wrap{margin-right:-10px}.hero{min-height:0}.toolbar{font-size:12px}.layout>aside{display:grid;gap:0}.footnote{margin-bottom:12px}}
h1,h2,h3,p{word-break:keep-all;overflow-wrap:anywhere}
.section-label{flex-wrap:wrap;gap:6px 12px}.section-label h2{margin-bottom:0}
@media(max-width:850px){.topbar>.eyebrow{font-size:0}.topbar>.eyebrow:before{content:'portfolio.';font-size:19px;letter-spacing:-.7px;color:var(--ink)}.topbar .actions{flex-wrap:nowrap;align-items:center;gap:8px}.demo{max-width:145px;font-size:9px;line-height:1.4}.pagehead{margin:20px 0}.hero h2{font-size:22px}.hero-footer{margin-top:16px}.toolbar{margin-bottom:12px!important}.hero{padding:18px}.pagehead p{margin-bottom:0}}

<aside class="sidebar"><div class="brand">portfolio<span>.</span><small>INVEST WITH CONTEXT</small></div><nav class="nav" aria-label="주 메뉴"></nav><div class="aside-bottom"><button data-modal="activity">활동 기록 ↗</button><button data-modal="guide">사용 안내 ↗</button><button data-modal="settings">설정 ↗</button></div><div class="avatar">◉ &nbsp; 나의 포트폴리오<br><span class="tiny">화면 설계용 가상 계정</span></div></aside>
<main><header class="topbar"><span class="eyebrow">PORTFOLIO / YOUR DAILY PERSPECTIVE</span><div class="actions"><span class="demo">디자인 시안 · 모든 데이터는 가상</span><button class="mobile-more" data-modal="settings" aria-label="설정과 보조 메뉴">☰</button></div></header><div id="page"></div></main>
<nav class="mobile-nav" aria-label="모바일 주 메뉴"></nav>
<div class="sheet" id="sheet" hidden><section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-top"><span class="eyebrow">PORTFOLIO · DETAIL</span><button id="close" aria-label="상세 닫기">닫기 ×</button></div><div id="detail"></div></section></div><div class="toast" role="status" aria-live="polite"></div>
<script>
const navs=[['today','오늘','◷'],['assets','자산','◫'],['decisions','판단','◇'],['tasks','할 일','☑'],['principles','원칙','≡']];
let current='today',todayState='review',filter='all',accepted=false,taskPaused=false,filled=false,focusBefore=null;
let principle='장기 자산 형성을 목표로 합니다. 단기 뉴스만으로 매매하지 않고, 비중 이탈은 신규 적립금으로 먼저 보정합니다.';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=(t,c='')=>'<span class="pill '+c+'">'+t+'</span>';
function heading(k,t,d,actions=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'+actions+'</div>'}
function toast(t){document.querySelector('.toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.querySelector('.toast').textContent='',3500)}
function render(){document.querySelectorAll('.nav,.mobile-nav').forEach(el=>el.innerHTML=navs.map(([id,label,icon],i)=>'<button data-page="'+id+'" '+(id===current?'aria-current="page"':'')+'><span class="'+(el.classList.contains('nav')?'num':'')+'">'+(el.classList.contains('nav')?'0'+(i+1):icon)+'</span>'+label+'</button>').join(''));document.querySelector('#page').innerHTML=({today:today,assets:assets,decisions:decisions,tasks:tasks,principles:principles})[current]();}
function today(){let content=todayState==='empty'?'<div class="card blank"><div class="eyebrow">YOUR FIRST REVIEW</div><h2>내 투자 이야기를 시작해 보세요.</h2><p class="muted">현재 잔고와 짧은 원칙이면 충분합니다.<br>과거 거래를 모두 복원할 필요는 없어요.</p><div class="actions" style="justify-content:center"><button data-modal="entry">현재 잔고 등록</button><button class="primary" data-modal="start">첫 점검 시작하기</button></div></div>':'<article class="card hero">'+pill(todayState==='review'?'판단할 항목 1개':todayState==='quiet'?'추가 행동 없음':'일부 자료 미확인',todayState==='partial'?'amber':'')+'<h2>'+(todayState==='review'?'매도에 앞서,<br>보유 이유를 한 번 확인하세요.':todayState==='quiet'?'오늘은 기존 계획을<br>이어가도 좋겠습니다.':'오늘은 일부 종목의 변화를<br>충분히 확인하지 못했습니다.')+'</h2><p>'+(todayState==='review'?'A기업의 전망 변경이 기존의 ‘실적 개선 기대’에 영향을 줄 수 있습니다.':todayState==='quiet'?'확인한 범위에서는 기존 판단을 바꿀 새 근거를 찾지 못했습니다.':'A기업의 최신 발표를 확인하지 못했습니다. 이전의 유지 의견을 오늘 의견으로 갱신하지 않았습니다.')+'</p><div class="hero-footer"><span class="tiny muted">최근 분석 · 9월 21일 08:10 · ChatGPT 작성</span><button class="linkbtn" data-modal="brief">전체 브리핑 읽기 ↗</button></div></article>';
return heading('MONDAY, SEPTEMBER 21','오늘의 투자 점검','지난 점검 이후 달라진 것, 그리고 다음에 볼 것.', '<button class="primary" data-modal="start">ChatGPT에서 새 점검 ↗</button>')+'<div class="toolbar" style="margin-bottom:18px"><span class="tiny muted">시안 상태 살펴보기</span><select id="scenario" aria-label="오늘 화면 상태">'+[['review','확인할 변화'],['quiet','추가 행동 없음'],['partial','자료 부족'],['empty','첫 사용']].map(([v,t])=>'<option value="'+v+'" '+(v===todayState?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="layout"><section>'+content+(todayState!=='empty'?'<article class="card"><div class="section-label"><h2>지난번 질문의 다음 장</h2><span class="tiny muted">9월 18일 점검에서 이어짐</span></div><div class="row"><div>'+pill('조사 · '+(taskPaused?'보류':'자료 대기'),'gray')+'<h3 style="margin-top:9px">A기업의 수요 둔화는 일시적일까?</h3><p class="muted">다음 실적 발표에서 신규 주문 회복을 확인하기로 했습니다.</p></div><button data-modal="research" aria-label="수요 둔화 질문 상세">↗</button></div><div class="row"><div><h3>적립금으로 비중을 맞추기로 했어요</h3><p class="muted">채권 ETF 매수 계획 · '+(filled?'10 / 10주 체결':'6 / 10주 체결')+'</p></div><button data-modal="execution" aria-label="채권 매수 실행 상세">↗</button></div></article>':'')+'</section><aside><article class="card"><div class="eyebrow">MY COMPASS</div><h2 style="margin-top:12px">지금 적용하는 원칙</h2><p>'+esc(principle)+'</p><button class="linkbtn" data-page="principles">내 원칙 보기 →</button></article><article class="card"><h3>기록의 기준시점</h3><p class="tiny muted">서로 다른 시점을 구분해서 봅니다.</p><div class="row"><span>종합계좌 잔고 확인</span><span class="tiny">9월 18일</span></div><div class="row"><span>마지막 매매 입력</span><span class="tiny">9월 19일</span></div><div class="row"><span>시세 기준</span><span class="tiny">9월 18일 종가</span></div><button class="linkbtn" data-modal="asset">확인 범위 보기 →</button></article></aside></div><p class="footnote">새 분석은 요청할 때 작성됩니다. 저장된 분석의 날짜와 조사 범위를 확인해 주세요.</p>';}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){current=b.dataset.page;filter='all';closeModal();render();window.scrollTo(0,0);return}if(b.dataset.modal){openModal(b.dataset.modal);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.id==='close'){closeModal();return}const a=b.dataset.action;if(a==='copy'){try{await navigator.clipboard.writeText('오늘 내 포트폴리오 점검하고 저장해줘.');toast('점검 문구를 복사했습니다. ChatGPT에서 보내주세요.')}catch{toast('위 점검 문구를 선택해 직접 복사해 주세요.')}}if(a==='accept'){accepted=true;render();openModal('decision');toast('가상 시안에서 판단을 채택했습니다.')}if(a==='pause'){taskPaused=!taskPaused;render();openModal('research');toast('시안의 질문 상태를 변경했습니다.')}if(a==='fill'){filled=true;render();openModal('execution');toast('가상 체결 4주를 반영했습니다. 실제 거래는 저장되지 않습니다.')}if(a==='save-policy'){const value=document.querySelector('#principle').value.trim();if(!value){toast('짧은 원칙을 입력해 주세요.');return}principle=value;render();closeModal();toast('현재 시안에만 적용했습니다.')}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){todayState=e.target.value;render()}});
document.querySelector('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeModal()});
document.addEventListener('keydown',e=>{if(document.querySelector('#sheet').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...document.querySelectorAll('#sheet button:not([disabled]),#sheet textarea,#sheet input')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
